<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | SMM Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080b14;
      color: white;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #101522;
      border: 1px solid #202638;
      border-radius: 16px;
      padding: 30px;
    }

    .logo {
      text-align: center;
      color: #756cff;
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #858da1;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #aeb4c5;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      background: #0b0f1a;
      border: 1px solid #2a3145;
      border-radius: 8px;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #6c63ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #858da1;
      font-size: 14px;
    }

    .login a {
      color: #756cff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">SMM PANEL</div>

    <h1>Create your account</h1>
    <p class="subtitle">
      Create a customer account to access your dashboard.
    </p>

    <form id="signupForm">

      <label>Full Name</label>
      <input
        id="name"
        type="text"
        placeholder="Enter your name"
        required
      >

      <label>Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        placeholder="Minimum 6 characters"
        minlength="6"
        required
      >

      <button id="signupBtn" type="submit">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>


  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // =====================================
    // PUT YOUR SUPABASE DETAILS HERE
    // =====================================

    const SUPABASE_URL = "https://qqttryckhwpbgzjmkrnj.supabase.co";

    const SUPABASE_KEY = "sb_publishable_4u-pJN7ausMBsb9dOffdxA_T9nfKvlj";


    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupBtn");
    const message = document.getElementById("message");


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      button.disabled = true;
      button.textContent = "Creating account...";
      message.textContent = "";


      const { data, error } =
        await supabase.auth.signUp({

          email: email,

          password: password,

          options: {
            data: {
              full_name: name
            }
          }

        });


      if (error) {

        message.textContent =
          "❌ " + error.message;

        button.disabled = false;
        button.textContent = "Create Account";

        return;
      }


      message.textContent =
        "✅ Account created successfully!";


      form.reset();

      button.disabled = false;
      button.textContent = "Create Account";

    });

  </script>

</body>
</html>
