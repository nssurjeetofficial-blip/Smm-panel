<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Funds - SMM PANEL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:#080b12;
  color:#fff;
  min-height:100vh
}

header{
  background:#111722;
  border-bottom:1px solid #252d3d;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.logo{
  font-size:21px;
  font-weight:bold
}

.back{
  color:#4f8cff;
  text-decoration:none
}

.container{
  max-width:700px;
  margin:auto;
  padding:35px 20px
}

h1{
  font-size:30px;
  margin-bottom:8px
}

.subtitle{
  color:#8f9bad;
  margin-bottom:25px
}

.card{
  background:#111722;
  border:1px solid #252d3d;
  border-radius:16px;
  padding:25px
}

.balance{
  background:#0b1019;
  border:1px solid #252d3d;
  border-radius:12px;
  padding:18px;
  margin-bottom:25px
}

.balance-title{
  color:#8f9bad;
  font-size:13px
}

.balance-amount{
  font-size:28px;
  font-weight:bold;
  margin-top:7px
}

label{
  display:block;
  margin-bottom:8px;
  color:#cbd5e1
}

input,select{
  width:100%;
  padding:13px;
  margin-bottom:18px;
  border-radius:10px;
  border:1px solid #30394b;
  background:#0b1019;
  color:#fff;
  outline:none
}

input:focus,select:focus{
  border-color:#4f8cff
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#4f8cff;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}

.note{
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  background:#172033;
  color:#9aa7ba;
  font-size:13px;
  line-height:1.5
}

footer{
  text-align:center;
  padding:30px;
  color:#667085;
  font-size:13px
}
</style>
</head>

<body>

<header>
  <div class="logo">SMM PANEL</div>
  <a href="dashboard.html" class="back">← Dashboard</a>
</header>

<main class="container">

  <h1>Add Funds</h1>
  <p class="subtitle">Add balance to your panel account.</p>

  <div class="card">

    <div class="balance">
      <div class="balance-title">Current Balance</div>
      <div class="balance-amount">₹0.00</div>
    </div>

    <form id="fundForm">

      <label>Amount</label>

      <input
        type="number"
        id="amount"
        min="1"
        step="0.01"
        placeholder="Enter amount"
        required
      >

      <label>Payment Method</label>

      <select id="paymentMethod" required>
        <option value="">Select payment method</option>
        <option value="upi">UPI</option>
        <option value="card">Card</option>
        <option value="other">Other</option>
      </select>

      <button type="submit">Continue to Payment</button>

    </form>

    <div class="note">
      Payment processing will be connected later through a secure,
      authorized payment provider. Do not enter card numbers or
      payment credentials directly into this page.
    </div>

  </div>

</main>

<footer>
  © 2026 SMM PANEL. All rights reserved.
</footer>

<script>
document.getElementById("fundForm").addEventListener("submit", function(e){
  e.preventDefault();

  const amount = document.getElementById("amount").value;
  const method = document.getElementById("paymentMethod").value;

  if(!amount || !method){
    alert("Please complete all fields.");
    return;
  }

  alert(
    "Payment setup is not connected yet. Amount: ₹" +
    amount +
    " | Method: " +
    method
  );
});
</script>

</body>
  </html>
