<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | SMM Panel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b14;
      color: #fff;
    }

    .navbar {
      height: 65px;
      background: #0d111d;
      border-bottom: 1px solid #202638;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
    }

    .logo {
      color: #756cff;
      font-size: 21px;
      font-weight: bold;
    }

    .user {
      background: #151a29;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 65px);
    }

    .sidebar {
      width: 230px;
      background: #0d111d;
      border-right: 1px solid #202638;
      padding: 25px 15px;
    }

    .sidebar a {
      display: block;
      text-decoration: none;
      color: #aeb4c5;
      padding: 13px 15px;
      margin-bottom: 7px;
      border-radius: 8px;
      font-size: 14px;
    }

    .sidebar a:hover,
    .sidebar .active {
      background: #6c63ff;
      color: white;
    }

    .main {
      flex: 1;
      padding: 30px;
      overflow: hidden;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #858da1;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: #101522;
      border: 1px solid #202638;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-title {
      color: #858da1;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
    }

    .order-box {
      background: #101522;
      border: 1px solid #202638;
      border-radius: 12px;
      padding: 25px;
    }

    .order-box h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #aeb4c5;
      font-size: 13px;
      margin-bottom: 8px;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      background: #0b0f1a;
      border: 1px solid #2a3145;
      border-radius: 8px;
      color: white;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #6c63ff;
    }

    .submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #6c63ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:hover {
      opacity: 0.9;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .sidebar {
        display: none;
      }

      .main {
        padding: 20px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .welcome h1 {
        font-size: 23px;
      }
    }
  </style>
</head>
  
<body>

  <div class="navbar">
    <div class="logo">SMM PANEL</div>
    <div class="user">👤 <span id="userName">Customer</span></div>
  </div>

  <div class="layout">

    <aside class="sidebar">
      <a href="dashboard.html" class="active">🏠 Dashboard</a>
      <a href="dashboard.html">🛒 New Order</a>
      <a href="orders.html">📦 My Orders</a>
      <a href="add-funds.html">💰 Add Funds</a>
      <a href="services.html">📊 Services</a>
      <a href="profile.html">👤 Profile</a>
      <a href="#" onclick="logout(); return false;">🚪 Logout</a>
    </aside>

    <main class="main">

      <div class="welcome">
        <h1>Welcome back 👋</h1>
        <p>Manage your services and orders from your dashboard.</p>
      </div>

      <div class="stats">

        <div class="stat">
          <div class="stat-title">Account Balance</div>
          <div class="stat-value">₹0.00</div>
        </div>

        <div class="stat">
          <div class="stat-title">Total Orders</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">Completed</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">Pending</div>
          <div class="stat-value">0</div>
        </div>

      </div>

      <div class="order-box">

        <h2>🛒 Create New Order</h2>

        <div class="form-group">
          <label>Platform</label>

          <select>
            <option>Select Platform</option>
            <option>Instagram</option>
            <option>YouTube</option>
            <option>Facebook</option>
            <option>TikTok</option>
          </select>
        </div>

        <div class="form-group">
          <label>Service</label>

          <select id="serviceSelect">
  <option value="">Loading services...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Target URL</label>

        <input
  id="targetUrl"
  type="url"
  placeholder="https://example.com/your-content"
  required>
          
        </div>

        <div class="form-group">
          <label>Quantity</label>

          <button class="submit" id="submitOrder" type="button">
  Submit Order
</button>

<p id="orderMessage" role="status"></p>
        </div>
        <button class="submit" id="submitOrder" type="button">
  Submit Order
</button>

<p id="orderMessage" role="status"></p>
      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient = window.supabase.createClient(
  "https://qqttryckhwpbgzjmkrnj.supabase.co",
  "sb_publishable_4u-pJN7ausMBsb9dOffdxA_T9nfKvlj"
);

async function checkLogin() {
  const { data: { user } } =
    await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const name =
    user.user_metadata?.full_name ||
    user.email ||
    "User";

  const userName = document.getElementById("userName");

  if (userName) {
    userName.textContent = name;
  }
}

async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = "login.html";
}
async function loadServices() {
  const serviceSelect = document.getElementById("serviceSelect");

  const { data, error } = await supabaseClient
    .from("services")
    .select("id, name, platform, price")
    .eq("active", true)
    .order("id");

  if (error) {
    console.error(error);
    serviceSelect.innerHTML =
      '<option value="">Unable to load services</option>';
    return;
  }

  serviceSelect.innerHTML =
    '<option value="">Select Service</option>';

  data.forEach(service => {
    const option = document.createElement("option");

    option.value = service.id;
    option.textContent =
      `${service.name} — ₹${Number(service.price).toFixed(2)}`;

    serviceSelect.appendChild(option);
  });
  }

checkLogin();
loadServices();
</script>
</body>
</html>
