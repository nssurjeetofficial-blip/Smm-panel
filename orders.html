<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - SMM PANEL</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#080b12;color:#fff;min-height:100vh}
header{
  background:#111722;
  border-bottom:1px solid #25window.location.href2d3d;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.logo{font-size:21px;font-weight:bold}
.back{color:#4f8cff;text-decoration:none}

.container{max-width:1100px;margin:auto;padding:30px 18px}

h1{font-size:30px;margin-bottom:8px}
.subtitle{color:#8f9bad;margin-bottom:25px}

.table-box{
  background:#111722;
  border:1px solid #252d3d;
  border-radius:15px;
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px
}

th,td{
  padding:16px;
  text-align:left;
  border-bottom:1px solid #252d3d;
  font-size:14px
}

th{color:#8f9bad;font-weight:600}
td{color:#dbe2ee}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  background:#263449;
  color:#60a5fa
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#8f9bad
}

.new-order{
  display:inline-block;
  margin-top:18px;
  padding:11px 18px;
  background:#4f8cff;
  color:#fff;
  text-decoration:none;
  border-radius:9px;
  font-weight:bold
}

footer{
  text-align:center;
  padding:30px;
  color:#667085;
  font-size:13px
}
</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<script>
const supabaseClient = window.supabase.createClient(
  "https://qqttryckhwpbgzjmkrnj.supabase.co",
  "sb_publishable_4u-pJN7ausMBsb9dOffdxA_T9nfKvlj"
);
</script>
<header>
  <div class="logo">SMM PANEL</div>
  <a href="dashboard.html" class="back">← Dashboard</a>
</header>

<main class="container">

  <h1>My Orders</h1>
  <p class="subtitle">View and track your order history.</p>

  <div class="table-box">

    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Service</th>
          <th>Target</th>
          <th>Quantity</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody id="ordersTable">
  <tr>
    <td colspan="7">
      <div class="empty">Loading your orders...</div>
    </td>
  </tr>
      </tbody>

        <tr>
          <td colspan="7">
            <div class="empty">
              No orders yet.
              <br>
              <a href="dashboard.html" class="new-order">
                Create New Order
              </a>
            </div>
          </td>
        </tr>

      </tbody>
    </table>

  </div>

</main>

<footer>
  © 2026 SMM PANEL. All rights reserved.
</footer>
<script>
async function loadOrders() {
  const table = document.getElementById("ordersTable");

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  try {
    const { data: authData, error: authError } =
      await supabaseClient.auth.getUser();

    if (authError || !authData.user) {
      window.location.href = "login.html";
      return;
    }

    const { data: orders, error } = await supabaseClient
      .from("orders")
      .select("id, service_id, target_url, quantity, amount, status, created_at")
      .eq("user_id", authData.user.id)
      .order("created_at", { ascending: false });

    if (error) throw error;

    if (!orders || orders.length === 0) {
      table.innerHTML = `
        <tr><td colspan="7">
          <div class="empty">
            No orders yet.<br>
            <a href="dashboard.html" class="new-order">
              Create New Order
            </a>
          </div>
        </td></tr>`;
      return;
    }

    const serviceIds = [...new Set(orders.map(order => order.service_id))];

    const { data: services, error: serviceError } = await supabaseClient
      .from("services")
      .select("id, name")
      .in("id", serviceIds);

    if (serviceError) throw serviceError;

    const serviceMap = new Map(
      (services || []).map(service => [String(service.id), service.name])
    );

    table.innerHTML = orders.map(order => {
      const date = order.created_at
        ? new Date(order.created_at).toLocaleString()
        : "—";

      const amount = Number(order.amount);

      return `
        <tr>
          <td>${escapeHTML(order.id)}</td>
          <td>${escapeHTML(serviceMap.get(String(order.service_id)) || "Service")}</td>
          <td>
            <a href="${escapeHTML(order.target_url)}"
               target="_blank"
               rel="noopener noreferrer"
               style="color:#4f8cff">
              View target
            </a>
          </td>
          <td>${escapeHTML(order.quantity)}</td>
          <td>${Number.isFinite(amount) ? "₹" + amount.toFixed(2) : "—"}</td>
          <td><span class="status">${escapeHTML(order.status)}</span></td>
          <td>${escapeHTML(date)}</td>
        </tr>`;
    }).join("");

  } catch (error) {
    console.error("Orders loading error:", error);
    table.innerHTML = `
      <tr><td colspan="7">
        <div class="empty">
          Could not load orders. Please refresh and try again.
        </div>
      </td></tr>`;
  }
}

loadOrders();
  </script>
</body>
</html>
