<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - SMM PANEL</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#080b12;color:#fff;min-height:100vh}
header{
  background:#111722;
  border-bottom:1px solid #252d3d;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.logo{font-size:21px;font-weight:bold}
.back{color:#4f8cff;text-decoration:none}

.container{max-width:1100px;margin:auto;padding:30px 18px}

h1{font-size:30px;margin-bottom:8px}
.subtitle{color:#8f9bad;margin-bottom:25px}

.table-box{
  background:#111722;
  border:1px solid #252d3d;
  border-radius:15px;
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px
}

th,td{
  padding:16px;
  text-align:left;
  border-bottom:1px solid #252d3d;
  font-size:14px
}

th{color:#8f9bad;font-weight:600}
td{color:#dbe2ee}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  background:#263449;
  color:#60a5fa
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#8f9bad
}

.new-order{
  display:inline-block;
  margin-top:18px;
  padding:11px 18px;
  background:#4f8cff;
  color:#fff;
  text-decoration:none;
  border-radius:9px;
  font-weight:bold
}

footer{
  text-align:center;
  padding:30px;
  color:#667085;
  font-size:13px
}
</style>
</head>

<body>

<header>
  <div class="logo">SMM PANEL</div>
  <a href="dashboard.html" class="back">← Dashboard</a>
</header>

<main class="container">

  <h1>My Orders</h1>
  <p class="subtitle">View and track your order history.</p>

  <div class="table-box">

    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Service</th>
          <th>Target</th>
          <th>Quantity</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody id="ordersTable">

        <tr>
          <td colspan="7">
            <div class="empty">
              No orders yet.
              <br>
              <a href="dashboard.html" class="new-order">
                Create New Order
              </a>
            </div>
          </td>
        </tr>

      </tbody>
    </table>

  </div>

</main>

<footer>
  © 2026 SMM PANEL. All rights reserved.
</footer>

</body>
</html>
